server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / { try_files $uri /index.html; }

    # $hostname is the pod name, so refreshing shows which replica answered
    location = /info {
        default_type application/json;
        add_header Cache-Control no-store;
        return 200 '{"pod":"$hostname","runtime":"Kubernetes pod (nginx)","max_bitrate":"4K"}';
    }
}
